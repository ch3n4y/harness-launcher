<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harness Launcher</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand"><span class="mark">H</span><div><h1>Harness</h1><span class="muted">服务启动器</span></div></div><div class="menu-wrap"><button id="menuToggle" aria-label="更多选项" aria-expanded="false" aria-controls="menu">•••</button><nav id="menu" hidden><button data-page="settings">环境与设置</button><button data-page="manage">安装管理</button><button data-page="logPage">运行日志</button><hr><button id="restart">重启服务</button></nav></div></header>
<main><section id="home" class="page"><div class="service-state"><span id="indicator" class="indicator"></span><span id="status">检测中</span></div><p class="address">127.0.0.1:3080</p><div class="main-actions"><button id="start" class="primary">启动服务</button><button id="stop" hidden>停止服务</button><button id="open">打开浏览器 ↗</button></div><div class="summary"><span id="summary">正在检测环境…</span><button class="text-button" data-page="manage">管理</button></div><div class="shortcuts"><button data-page="logPage">运行日志 <span>›</span></button><button data-page="settings">环境与设置 <span>›</span></button></div><p class="footnote">关闭窗口后，服务继续在托盘运行。</p></section>
<section id="settings" class="page" hidden><div class="page-title"><button class="back" data-page="home" aria-label="返回">‹</button><h2>环境与设置</h2></div><label for="node">Node 路径 <span class="muted">留空自动定位</span></label><div class="field"><input id="node" placeholder="自动查找 Node"><button id="pickNode">选择</button></div><label for="cwd">工作目录</label><div class="field"><input id="cwd"><button id="pickCwd">选择</button></div><label class="check"><input type="checkbox" id="autoOpen"> 服务就绪后自动打开浏览器</label><div class="buttons settings-actions"><button id="detect">重新检测</button><button id="save" class="primary">保存设置</button></div></section>
<section id="manage" class="page" hidden><div class="page-title"><button class="back" data-page="home" aria-label="返回">‹</button><h2>安装管理</h2></div><pre id="runtime">正在检测…</pre><p class="footnote">与终端共用 npm 全局安装。更新会影响同一份 Harness。</p><button id="install" class="primary full">安装 Harness</button><button class="text-button full" data-page="logPage">查看安装日志 ›</button></section>
<section id="logPage" class="page" hidden><div class="page-title"><button class="back" data-page="home" aria-label="返回">‹</button><h2>运行日志</h2><label class="check"><input type="checkbox" id="follow" checked> 自动滚动</label></div><pre id="logs" aria-live="off"></pre><div class="buttons"><button id="clear">清空</button><button id="copy">复制</button><button id="export">导出</button></div></section></main><p id="message" role="status"></p><script src="renderer.js"></script></body></html>
