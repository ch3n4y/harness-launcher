<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harness Launcher</title><link rel="stylesheet" href="style.css"></head><body><div id="windowShell" class="window-shell">
<header id="titlebar"><div class="brand"><span class="mark">H</span><div><h1>Harness</h1><span class="muted">服务启动器</span></div></div><div class="window-tools"><button id="minimizeWindow" class="window-control" aria-label="最小化">−</button><button id="hideWindow" class="window-control" aria-label="隐藏到托盘">×</button><div class="menu-wrap"><button id="menuToggle" aria-label="更多选项" aria-expanded="false" aria-controls="menu">•••</button><nav id="menu" hidden><button data-page="settings">环境与设置</button><button data-page="manage">安装管理</button><button data-page="logPage">运行日志</button><hr><button id="restart">重启服务</button></nav></div></div></header>
<main><section id="home" class="page"><div class="service-state"><span id="indicator" class="indicator"></span><span id="status">检测中</span></div><p class="address">127.0.0.1:3080</p><div class="main-actions"><button id="start" class="primary">启动服务</button><button id="stop" hidden>停止服务</button><button id="open">打开浏览器 ↗</button></div><div class="summary"><span id="summary">正在检测环境…</span><button class="text-button" data-page="manage">管理</button></div><div class="shortcuts"><button data-page="logPage">运行日志 <span>›</span></button><button data-page="settings">环境与设置 <span>›</span></button></div><p class="footnote">关闭窗口后，服务继续在托盘运行。</p></section>
<section id="settings" class="page" hidden><div class="page-title"><button class="back" data-page="home" aria-label="返回">‹</button><h2>环境与设置</h2></div><div class="node-label"><label for="node">Node 环境</label><button id="autoNode" class="text-button">自动选择</button></div><div class="field"><input id="node" list="nodeCandidates" placeholder="选择或输入 Node 完整路径" autocomplete="off"><datalist id="nodeCandidates"></datalist><button id="pickNode">选择文件</button></div><p id="selectedNode" class="footnote"></p><label for="cwd">工作目录</label><div class="field"><input id="cwd"><button id="pickCwd">选择</button></div><label class="check"><input type="checkbox" id="autoOpen"> 服务就绪后自动打开浏览器</label><div class="buttons settings-actions"><button id="detect">重新检测</button><button id="save" class="primary">保存设置</button></div></section>
<section id="manage" class="page" hidden><div class="page-title"><button class="back" data-page="home" aria-label="返回">‹</button><h2>安装管理</h2></div><pre id="runtime">正在检测…</pre><p class="footnote">与终端共用 npm 全局安装。更新会影响同一份 Harness。</p><button id="install" class="primary full">安装 Harness</button><button class="text-button full" data-page="logPage">查看安装日志 ›</button><div class="update-card"><h2>启动器更新 <span class="badge">GitHub</span></h2><p id="updateStatus" class="footnote" role="status">从 GitHub Releases 获取适用于本机的正式版。</p><pre id="releaseNotes" hidden></pre><div class="buttons"><button id="checkUpdate">检查更新</button><button id="downloadUpdate" class="primary" hidden>下载并打开安装包</button></div><p class="footnote">下载后校验 SHA256。请退出启动器，按安装程序提示完成更新。</p></div></section>
<section id="logPage" class="page" hidden><div class="page-title"><button class="back" data-page="home" aria-label="返回">‹</button><h2>运行日志</h2><label class="check"><input type="checkbox" id="follow" checked> 自动滚动</label></div><pre id="logs" aria-live="off"></pre><div class="buttons"><button id="clear">清空</button><button id="copy">复制</button><button id="export">导出</button></div></section></main><p id="message" role="status"></p></div><script src="renderer.js"></script></body></html>
